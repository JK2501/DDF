spring:
  application:
    name: web
  cache:
    type: simple
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 86400
          cache-public: true
  server:
    compression:
      enabled: true
      mime-types: text/html,text/xml,text/plain,text/css,application/javascript,application/json
      min-response-size: 1024
      compression-level: 6

  mongodb:
    uri: ${MONGODB_URI}
    database: DDF