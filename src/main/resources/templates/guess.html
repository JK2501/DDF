<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="Guess Die drei ??? episodes">
        <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0">
        <title>Guess</title>
        <link rel="icon" href="../static/icon/icon.png" th:href="@{/icon/icon.png}">
        <link rel="stylesheet" href="../static/css/general.css" th:href="@{/css/general.css}">
        <link rel="stylesheet" href="../static/css/guess.css" th:href="@{/css/guess.css}">
        <script>
            function FilterList(){let e=document.getElementById("guess-search").value.toUpperCase(),t=document.getElementById("guess-filter-list").getElementsByTagName("li");for(i=0;i<t.length;i++){t[i].textContent.toUpperCase().indexOf(e)>-1?(t[i].style.display="flex",t[i].style.height="auto"):t[i].style.display="none"}}function SubmitEpisode(e){let t=document.getElementById("guess-search"),i=document.getElementsByTagName("form")[0];t.value=e.dataset.title,i.submit()}
        </script>
    </head>
    <body>
        <div class="guess">
            <div class="guess-return">
                <a th:href="@{/home}"><span>🏠︎</span></a>
                <th:block th:switch="${game.getCluesType()}">
                    <a th:case="'emojis'"><span><h3>Emojis</h3></span></a>
                    <a th:case="'quote'"><span><h3>Zitate</h3></span></a>
                </th:block>
                <th:block th:switch="${game.getCluesType()}">
                    <a th:case="'emojis'" th:href="@{/quote}"><span>▶</span></a>
                    <a th:case="'quote'" th:href="@{/emojis}"><span>▶</span></a>
                </th:block>
            </div>
            <div class="guess-title">
                <th:block th:switch="${game.getCluesType()}">
                    <h2 th:case="'emojis'">Welche Die drei ?<span style="color: red;">?</span><span style="color: blue;">?</span> Folge beschreiben diese Emojis?</h2>
                    <h2 th:case="'quote'">Welche Die drei ?<span style="color: red;">?</span><span style="color: blue;">?</span> Folge beschreibt dieses Zitat?</h2>
                </th:block>
            </div>
            <div class="guess-header">
                <div th:each="clue : ${game.getCluesDisplayed()}">
                    <span th:text="${clue}" th:class="${game.getCluesType()}"></span>
                </div>
            </div>
            <form th:action="@{/guess}" method="post">
                <input type="hidden" name="type" th:value="${game.cluesType}" />
                <input id="guess-search" type="text" name="guess" placeholder="Gib eine Folge ein: " onkeyup="FilterList()"></input>
            </form>
            <div class="guess-filter">
                <ul id="guess-filter-list">
                    <li class="list-item" th:each="episode : ${game.getEpisodes()}" onclick="SubmitEpisode(this)" th:data-title="${episode.getTitle()}">
                        <div class="list-item-image" th:style="${@spriteUtil.getCombinedStyling(episode.getNumber())}"></div>
                        <p th:text="${episode.getTitle()}"></p>
                    </li>
                </ul>
            </div>
            <div class="guess-list">
                <ul>
                    <li th:each="episode : ${game.getGuessesReversed()}" class="list-item" th:classappend="${(game.getRiddle().getId() == episode.getId().toString()) ? 'correct': 'incorrect'}">
                        <div class="list-item-image" th:style="${@spriteUtil.getCombinedStyling(episode.getNumber())}"></div>
                        <p th:text="${episode.getCombinedTitle()}"></p>
                    </li>
                </ul>
            </div>
        </div>
    </body>
</html>
